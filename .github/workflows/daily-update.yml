name: Daily OneState RP Mod Update

on:
  schedule:
    # Runs every day at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml Pillow

      - name: Run update script
        run: python update.py

      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html images/
          # Only commit if index.html or images actually changed
          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore: auto-update OneState RP mod info and images [$(date -u '+%Y-%m-%d')]"
            git push
            echo "Changes pushed successfully."
          fi
